<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glaze Picker</title>
<style>
:root{
  --bg:#faf8f3; --card:#ffffff; --ink:#2b2b26; --muted:#7a7669;
  --accent:#3f6b4f; --accent2:#8a5a3a; --line:#e7e2d6; --star:#c9a227;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1b18; --card:#26241f; --ink:#f0ede4; --muted:#a8a394;
    --accent:#7fc79a; --accent2:#d99a6c; --line:#3a372f; --star:#e6c34a;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1b18; --card:#26241f; --ink:#f0ede4; --muted:#a8a394;
  --accent:#7fc79a; --accent2:#d99a6c; --line:#3a372f; --star:#e6c34a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
header{
  position:sticky; top:0; z-index:10;
  background:var(--bg); padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px;
  border-bottom:1px solid var(--line);
}
h1{font-size:1.15rem; margin:0 0 2px; letter-spacing:.2px;}
.sub{color:var(--muted); font-size:.8rem; margin:0 0 10px;}
.tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;}
.tab{
  flex:0 0 auto; font-size:.78rem; padding:6px 12px; border-radius:999px;
  border:1px solid var(--line); color:var(--muted); background:transparent; white-space:nowrap;
}
.tab.active{background:var(--accent); color:#fff; border-color:var(--accent);}
main{padding:14px 16px 100px;}
.grid{
  display:grid; grid-template-columns:repeat(2,1fr); gap:12px;
}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  overflow:hidden; position:relative;
}
.card img{width:100%; height:120px; object-fit:cover; display:block; cursor:pointer;}
.card .body{padding:8px 9px 10px;}
.badge{
  display:inline-block; font-weight:700; font-size:.85rem;
  background:var(--accent); color:#fff; border-radius:7px; padding:1px 8px; margin-bottom:4px;
}
.desc{font-size:.72rem; line-height:1.25; color:var(--muted); margin:0;}
.star-btn{
  position:absolute; top:6px; right:6px; width:30px; height:30px; border-radius:50%;
  border:none; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center;
  font-size:16px; color:#fff;
}
.star-btn.on{background:var(--star); color:#fff;}
.empty{color:var(--muted); text-align:center; padding:40px 10px; font-size:.85rem;}

.dock{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px);
  background:linear-gradient(0deg,var(--bg) 65%,transparent);
}
.dock-inner{
  background:var(--accent); color:#fff; border-radius:14px; padding:10px 14px;
  display:flex; align-items:center; justify-content:space-between; font-size:.82rem;
  box-shadow:0 4px 14px rgba(0,0,0,.2);
}
.dock button{
  background:#fff; color:var(--accent); border:none; border-radius:10px;
  padding:7px 12px; font-weight:700; font-size:.8rem;
}

.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:30;
  display:none; align-items:flex-start; justify-content:center; overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 14px calc(env(safe-area-inset-bottom,0px) + 20px);
}
.overlay.show{display:flex;}
.sheet{
  background:var(--bg); border-radius:16px; width:100%; max-width:480px; padding:14px;
  color:var(--ink);
}
.sheet-close{
  display:block; margin-left:auto; background:none; border:none; color:var(--muted);
  font-size:1rem; padding:4px 8px;
}
.sheet img.full{width:100%; border-radius:10px; margin-top:4px;}
.compare-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.compare-grid .card img{height:110px;}
h2.sheet-title{font-size:1rem; margin:0 0 8px;}
</style>
</head>
<body>

<header>
  <h1>Glaze Picker — pottery test tiles</h1>
  <p class="sub">Tap a star to shortlist. Tap a photo to view full size.</p>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<div class="dock" id="dock" style="display:none;">
  <div class="dock-inner">
    <span id="dockCount">0 shortlisted</span>
    <button id="compareBtn">Compare</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <button class="sheet-close" id="closeOverlay">Close ✕</button>
    <div id="overlayContent"></div>
  </div>
</div>

let filter = 'all';
let favorites = {};
try {
  const saved = localStorage.getItem('glazeFavs');
  if (saved) favorites = JSON.parse(saved);
} catch(e) { favorites = {}; }

function saveFavs(){
  try { localStorage.setItem('glazeFavs', JSON.stringify(favorites)); } catch(e){}
}

const tabsDef = [
  {key:'all', label:'All'},
  {key:'num', label:'Numbers 1–13'},
  {key:'letter', label:'Letters A–C'},
  {key:'roman', label:'I–III'},
  {key:'fav', label:'★ Shortlist'},
];

function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  tabsDef.forEach(t=>{
    const b = document.createElement('button');
    b.className = 'tab' + (filter===t.key ? ' active':'');
    b.textContent = t.label;
    b.onclick = ()=>{ filter = t.key; render(); };
    el.appendChild(b);
  });
}

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let list = ITEMS;
  if (filter !== 'all' && filter !== 'fav') list = ITEMS.filter(i=>i.group===filter);
  if (filter === 'fav') list = ITEMS.filter(i=>favorites[i.id+'|'+i.file]);

  if (list.length === 0){
    grid.innerHTML = '<div class="empty">Nothing here yet — star a few glazes first.</div>';
    return;
  }

  list.forEach(it=>{
    const key = it.id+'|'+it.file;
    const card = document.createElement('div');
    card.className = 'card';
    const isFav = !!favorites[key];
    card.innerHTML = `
      <img src="${it.img}" data-key="${key}">
      <button class="star-btn ${isFav?'on':''}" data-key="${key}">★</button>
      <div class="body">
        <span class="badge">${it.id}</span>
        <p class="desc">${it.desc}</p>
      </div>
    `;
    grid.appendChild(card);
  });

  grid.querySelectorAll('.star-btn').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const k = btn.dataset.key;
      favorites[k] = !favorites[k];
      saveFavs();
      render();
    };
  });
  grid.querySelectorAll('img').forEach(img=>{
    img.onclick = ()=> openFull(img.dataset.key);
  });
}

function findItem(key){
  return ITEMS.find(i => (i.id+'|'+i.file) === key);
}

function openFull(key){
  const it = findItem(key);
  if(!it) return;
  document.getElementById('overlayContent').innerHTML = `
    <h2 class="sheet-title">${it.id} — ${it.desc}</h2>
    <img class="full" src="${it.img}">
  `;
  document.getElementById('overlay').classList.add('show');
}

function renderDock(){
  const favKeys = Object.keys(favorites).filter(k=>favorites[k]);
  const dock = document.getElementById('dock');
  if (favKeys.length === 0){ dock.style.display='none'; return; }
  dock.style.display='block';
  document.getElementById('dockCount').textContent = favKeys.length + ' shortlisted';
}

function openCompare(){
  const favKeys = Object.keys(favorites).filter(k=>favorites[k]);
  const list = favKeys.map(findItem).filter(Boolean);
  if(list.length === 0) return;
  let html = '<h2 class="sheet-title">Side-by-side comparison</h2><div class="compare-grid">';
  list.forEach(it=>{
    html += `<div class="card"><img src="${it.img}"><div class="body"><span class="badge">${it.id}</span><p class="desc">${it.desc}</p></div></div>`;
  });
  html += '</div>';
  document.getElementById('overlayContent').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}

document.getElementById('compareBtn').onclick = openCompare;
document.getElementById('closeOverlay').onclick = ()=>{
  document.getElementById('overlay').classList.remove('show');
};
document.getElementById('overlay').onclick = (e)=>{
  if (e.target.id === 'overlay') e.currentTarget.classList.remove('show');
};

function render(){
  renderTabs();
  renderGrid();
  renderDock();
}
render();
</script>
</body>
</html>
